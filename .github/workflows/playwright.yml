name: Playwright Tests

# ✅ Cuándo se ejecuta
on:
  push:
    branches: [main] # cuando haces push a main
  pull_request:
    branches: [main] # cuando creas un pull request
  workflow_dispatch: # ✅ permite ejecutarlo manualmente

jobs:
  test:
    name: 🎭 Playwright Tests
    runs-on: ubuntu-latest # ✅ corre en Linux (gratis en GitHub)
    timeout-minutes: 60

    steps:
      # 1. Descargar el código
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      # 2. Instalar Node.js
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      # 3. Instalar dependencias
      - name: 📚 Instalar dependencias
        run: npm ci

      # 4. Instalar browsers de Playwright
      - name: 🌐 Instalar browsers
        run: npx playwright install --with-deps chromium

      # 5. Crear archivos de credenciales desde secrets
      - name: 🔐 Crear credentials.ts
        run: |
          cat > tests/fixtures/credentials.ts << 'EOF'
          export const users = {
            valid: {
              username: '${{ secrets.ASEA_USERNAME }}',
              password: '${{ secrets.ASEA_PASSWORD }}',
            },
            invalid: {
              username: 'usuario_falso',
              password: 'password_falso',
            }
          }
          EOF

      # 6. Crear userData.ts desde secrets
      - name: 👤 Crear userData.ts
        run: |
          cat > tests/fixtures/userData.ts << 'EOF'
          export const userInfo = {
            basic: {
              email:     '${{ secrets.USER_EMAIL }}',
              firstName: '${{ secrets.USER_FIRSTNAME }}',
              lastName:  '${{ secrets.USER_LASTNAME }}',
              phone:     '${{ secrets.USER_PHONE }}',
            },
            address: {
              address1: '${{ secrets.USER_ADDRESS1 }}',
              address2: '${{ secrets.USER_ADDRESS2 }}',
              city:     '${{ secrets.USER_CITY }}',
              state:    '${{ secrets.USER_STATE }}',
              zip:      '${{ secrets.USER_ZIP }}',
            },
            shipping: {
              order:        'standard' as 'standard' | 'usps',
              subscription: 'standard' as 'standard' | 'usps',
            },
            card: {
              name:     '${{ secrets.CARD_NAME }}',
              number:   '${{ secrets.CARD_NUMBER }}',
              expMonth: '${{ secrets.CARD_EXPMONTH }}',
              expYear:  '${{ secrets.CARD_EXPYEAR }}',
              cvv:      '${{ secrets.CARD_CVV }}',
            }
          }
          EOF

      # 7. Correr los tests
      - name: 🧪 Correr tests de Playwright
        run: npx playwright test --project=chromium
        env:
          CI: true

      # 8. Subir reporte HTML
      - name: 📊 Subir reporte
        uses: actions/upload-artifact@v4
        if: always() # ✅ sube el reporte siempre, aunque fallen
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30 # guarda el reporte 30 días

      # 9. Subir resultados de tests fallidos
      - name: 📸 Subir evidencias de fallos
        uses: actions/upload-artifact@v4
        if: failure() # ✅ solo si hay fallos
        with:
          name: test-results
          path: test-results/
          retention-days: 30
